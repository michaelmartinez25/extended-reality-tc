<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Getting Started with VR</title>
    <meta name="description" content="Getting Started with VR">
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/0.9.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
        <a-assets>
          <img id="boxTexture" src="emans_face.jpg">
          <img id="skyTexture" src="background.png">
          <img id="groundTexture" src="emans_face.jpg">
          <img id="sphereTexture" src="emans_face.jpg">
        </a-assets>
        <a-light color="gold" type="point" intensity="2" position="2 4 4"></a-light>
        <a-camera>
            <a-cursor color="white"></a-cursor>
        </a-camera>       
        <a-sky src="#skyTexture"></a-sky>
        <a-sphere id="sphere1" src="#sphereTexture" position="0 2 5"></a-sphere>
        <a-box id="box1" src="#boxTexture" position="0 2 -5" rotation="0 0 0" scale="0.5 0.5 0.5"
        animation__position="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"
        animation__mouseenter="property: scale; to: 2.3 2.3 2.3; dur: 300; startEvents: mouseenter"
        animation__mouseleave="property: scale; to: 0.5 0.5 0.5; dur: 300; startEvents: mouseleave" ></a-box>
        <a-plane id="ground" src="#boxTexture" rotation="-90 0 0" width="30" height="30" repeat="10 10"></a-plane>
        <a-entity
            text="value: You are in the presence of EMAN! Bow down before him; color: #000"
            position="2 4 -5"
            scale="5 5 5">
        </a-entity>
        <a-entity position="0 0 -6">
          <a-box position="0 1 0" depth="1" height="0.5" width="1.5" color="gold"></a-box>
          <a-box position="0 1.75 -0.5" depth="0.1" height="1.5" width="1.5" color="gold"></a-box>
          <a-box position="-0.75 1.25 0" depth="1" height="0.5" width="0.2" color="gold"></a-box>
          <a-box position="0.75 1.25 0" depth="1" height="0.5" width="0.2" color="gold"></a-box>
          <a-sphere position="0 2.5 -0.5" radius="0.3" color="white"></a-sphere>
        </a-entity>
      </a-scene>
      
  </body>
</html>
